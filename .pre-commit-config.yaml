# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # Hard guard: a commit that adds a credential file is rejected before it
      # ever reaches the remote.
      - id: detect-private-key
      - id: forbid-submodules

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: alerts-only-guard
        name: alerts-only guard (no Kite order APIs in the source tree)
        entry: python -m pytest tests/test_alerts_only.py -q
        language: system
        pass_filenames: false
        always_run: true
