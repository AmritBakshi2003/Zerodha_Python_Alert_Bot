name: CI

# Runs on every pull request and on pushes that land on main.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a dependency release that breaks us surfaces on a quiet Monday
  # rather than on a live trading morning. 03:00 UTC = 08:30 IST.
  schedule:
    - cron: "0 3 * * 1"

# Least privilege: no job writes anything, and no secrets are referenced.
permissions:
  contents: read

# A new push to a branch makes its in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static analysis. Same configuration as pyproject.toml.
  # ---------------------------------------------------------------------------
  lint-types:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check src tests scripts

      - name: mypy
        run: mypy

  # ---------------------------------------------------------------------------
  # 2. Test suite on every supported interpreter. The 85% coverage gate lives in
  #    pyproject.toml (fail_under), so pytest-cov enforces it here for free.
  #    3.13/3.14 are the owner's runtimes: they report without blocking until
  #    they have been green twice, then flip `experimental` to false.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: true
          - python-version: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest --cov=kite_alerts --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          # A collection error can legitimately leave no report; the test job has
          # already failed by then, so a missing artifact must not add noise.
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Prove a cold checkout works: no pip cache, no reused workspace, and every
  #    offline entry point still produces the documented behaviour.
  # ---------------------------------------------------------------------------
  fresh-clone-integrity:
    name: Fresh-clone integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Deliberately the first step: on a pristine checkout nothing untracked may
      # exist, so any hit here means a source file is invisible to git - the exact
      # failure that silently dropped src/kite_alerts/data/. It also runs before
      # an install can create __pycache__ or *.egg-info artifacts.
      - name: Git hygiene (no source file is ignored)
        run: |
          ignored="$(git ls-files --others --ignored --exclude-standard src)"
          if [ -n "$ignored" ]; then
            echo "::error::untracked files under src/ are matched by .gitignore:"
            echo "$ignored"
            exit 1
          fi

          # --no-index makes check-ignore evaluate the rules even for tracked
          # paths, which is what catches a *tracked* source file living under a
          # directory an ignore rule would swallow.
          matched="$(git ls-files src | git check-ignore --no-index --stdin || true)"
          if [ -n "$matched" ]; then
            echo "::error::tracked source files match a .gitignore rule:"
            echo "$matched"
            exit 1
          fi

          echo "git hygiene OK: no file under src/ is ignored"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No `cache: pip` on purpose - this job exists to prove a cold install.

      - name: Install from a clean checkout
        run: pip install -e ".[dev]"

      - name: Demo via module matches demo_output.txt
        run: |
          python -m kite_alerts.demo > /tmp/demo-module.txt
          diff -u demo_output.txt /tmp/demo-module.txt

      - name: Demo via CLI matches demo_output.txt
        run: |
          kite-alerts demo > /tmp/demo-cli.txt
          diff -u demo_output.txt /tmp/demo-cli.txt

      # .env.example holds placeholders only, so config-check must pass offline.
      - name: config-check accepts placeholder values (no network)
        run: |
          cp .env.example /tmp/ci-placeholder.env
          kite-alerts --env-file /tmp/ci-placeholder.env config-check

      - name: Import integrity
        run: python scripts/check_imports.py

  # ---------------------------------------------------------------------------
  # 4. The hard constraint, isolated so a violation is obvious in the PR checks
  #    instead of hidden inside a 350-test run.
  # ---------------------------------------------------------------------------
  alerts-only:
    name: Alerts-only guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: The package must never reference an order API
        run: pytest tests/test_alerts_only.py -q

  # ---------------------------------------------------------------------------
  # 5. Windows parity. The owner runs the bot on a Windows PC, so the suite, the
  #    golden demo output and the PowerShell helpers are exercised there too.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest (coverage gate)
        run: pytest --cov=kite_alerts --cov-report=xml

      - name: Demo via CLI matches demo_output.txt
        run: python scripts/check_demo_golden.py -- kite-alerts demo

      - name: Demo via module matches demo_output.txt
        run: python scripts/check_demo_golden.py -- python -m kite_alerts.demo

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          $scripts = Get-ChildItem -Path 'scripts' -Recurse -Filter '*.ps1'
          if (-not $scripts) { Write-Host '::error::no .ps1 scripts found'; exit 1 }
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::$($errors[0].Message)"
              foreach ($e in $errors) {
                Write-Host "    line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "parsed OK: $($file.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (when available)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            try {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
            } catch {
              Write-Host "PSScriptAnalyzer unavailable in this image; skipping ($_)"
              exit 0
            }
          }
          Import-Module PSScriptAnalyzer
          # Write-Host is right for a console supervisor and the scripts are not a
          # reusable module, so PSAvoidUsingWriteHost would only add noise.
          $results = Invoke-ScriptAnalyzer -Path 'scripts' -Recurse -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: no errors or warnings'

  # ---------------------------------------------------------------------------
  # 6. JavaScript unit tests (badge.js, format.js, polling.js). Fast, no browser.
  # ---------------------------------------------------------------------------
  ui-js:
    name: UI JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 7. Playwright browser smoke tests. Runs only on PRs that touch UI code or
  #    when explicitly triggered (label 'ui-browser' or workflow_dispatch).
  # ---------------------------------------------------------------------------
  ui-browser:
    name: UI browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ui-browser') || github.event.action == 'opened' || github.event.action == 'synchronize') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e_ui tests
        run: pytest -m e2e_ui -v
