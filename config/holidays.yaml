# NSE trading holidays (optional).
#
# The bot treats every weekday as a trading day unless a date appears below, so an
# empty list is safe: the staleness watchdog still notices a closed market and the
# bot simply stays quiet.
#
# Fill this in from the official NSE holiday list for the year you are running in.
# Accepted shapes:
#
#   holidays: [2026-01-26, 2026-03-04]
#
#   holidays:
#     2026-01-26: Republic Day
#
# A stale list is reported at startup via TradingCalendar.holidays_stale_days().
holidays: []
