# NSE trading holidays (optional).
#
# The bot treats every weekday as a trading day unless a date appears below, so an
# empty list is safe: the staleness watchdog still notices a closed market and the
# bot simply stays quiet.
#
# An empty list (or a list with no dates for the current year) is reported once at
# startup, because on a holiday the bot would otherwise look like a stalled feed.
#
# Refresh it from the official NSE page instead of typing dates by hand:
#
#   python scripts/refresh_holidays.py --year 2026 --dry-run
#   python scripts/refresh_holidays.py --year 2026
#
# Accepted shapes:
#
#   holidays: [2026-01-26, 2026-03-04]
#
#   holidays:
#     2026-01-26: Republic Day
#
holidays: []
